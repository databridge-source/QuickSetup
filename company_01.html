<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company 01 — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    background: #14213D;
    color: #F4F1EA;
  }
  .card {
    text-align: center;
    max-width: 420px;
    padding: 3rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.2rem;
    margin-bottom: 0.8rem;
  }
  h1 span { color: #EEA236; }
  p {
    color: #9AA3B8;
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  a.logout {
    display: inline-block;
    padding: 0.7rem 1.4rem;
    background: transparent;
    border: 1px solid #EEA236;
    color: #EEA236;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.15s ease, color 0.15s ease;
  }
  a.logout:hover { background: #EEA236; color: #14213D; }
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome, <span>Company 01</span></h1>
    <p>You're signed in to the Company 01 workspace.</p>
    <a class="logout" href="index.html">Log out</a>
  </div>
</body>
</html>
