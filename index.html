<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataBridge — Sign in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    font-family: 'Inter', sans-serif;
    background: #14213D;
    color: #EDEEF0;
  }

  .panel {
    flex: 1.1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem 5rem;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(238,162,54,0.18), transparent 70%);
    top: -140px;
    left: -140px;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin-bottom: 2.5rem;
    z-index: 1;
  }

  .brand span { color: #EEA236; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.6rem;
    line-height: 1.2;
    max-width: 420px;
    z-index: 1;
  }

  p.tagline {
    margin-top: 1rem;
    color: #9AA3B8;
    max-width: 380px;
    line-height: 1.6;
    z-index: 1;
  }

  .form-side {
    flex: 1;
    background: #F4F1EA;
    color: #1B1D22;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
  }

  form {
    width: 100%;
    max-width: 340px;
  }

  form h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.7rem;
    margin-bottom: 0.4rem;
  }

  form p.sub {
    color: #6B6F78;
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.4rem;
    color: #33363E;
  }

  .field {
    margin-bottom: 1.3rem;
  }

  input {
    width: 100%;
    padding: 0.75rem 0.9rem;
    border: 1px solid #D6D2C4;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    background: #FFFFFF;
    color: #1B1D22;
    transition: border-color 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: #EEA236;
    box-shadow: 0 0 0 3px rgba(238,162,54,0.15);
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.6rem;
    font-size: 0.85rem;
  }

  .row a {
    color: #14213D;
    text-decoration: none;
    font-weight: 500;
  }

  .row a:hover { text-decoration: underline; }

  .remember {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: #6B6F78;
  }

  button {
    width: 100%;
    padding: 0.85rem;
    background: #14213D;
    color: #F4F1EA;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #1E2E52; }

  .error {
    display: none;
    background: #FBEAEA;
    border: 1px solid #E8B4B4;
    color: #9B3A3A;
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    margin-bottom: 1.2rem;
  }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    .panel { padding: 3rem 2rem 2rem; }
    h1 { font-size: 2rem; }
    .form-side { padding: 2.5rem 2rem; }
  }
</style>
</head>
<body>

  <div class="panel">
    <div class="brand">Data<span>Bridge</span></div>
    <h1>Your systems, connected in one place.</h1>
    <p class="tagline">Sign in to manage databases from a single dashboard.</p>
  </div>

  <div class="form-side">
    <form id="loginForm" autocomplete="off">
      <h2>Welcome back</h2>
      <p class="sub">Enter your credentials to continue.</p>

      <div class="error" id="errorMsg">Incorrect username or password.</div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" style="width:auto;"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>
  </div>

<script>
  // NOTE: This is client-side only and not secure — the credentials below
  // are visible to anyone who views the page source. Fine for a demo or
  // internal prototype, but use real server-side authentication for
  // anything handling sensitive data.
  const users = {
    "User_01": { password: "12345", redirect: "company_01.html" },
    "User_02": { password: "12346", redirect: "company_02.html" }
  };

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const errorBox = document.getElementById('errorMsg');
    const match = users[user];

    if (match && match.password === pass) {
      errorBox.style.display = 'none';
      window.location.href = match.redirect;
    } else {
      errorBox.style.display = 'block';
    }
  });
</script>

</body>
</html>
